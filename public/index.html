<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create API Key</title>
    <style>
        /* --- 1. Pengaturan Global & Latar Belakang (BIRU-HIJAU) --- */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #004D40; /* Latar belakang hijau teal tua */
            color: #FFFFFF;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* --- 2. Kotak Utama (Kartu) (BIRU-HIJAU) --- */
        .api-card {
            background-color: #00695C; /* Warna hijau teal kartu yang sedikit lebih terang */
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            font-size: 2rem;
            margin-top: 0;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #B2DFDB; /* Warna hijau muda untuk subjudul */
            margin-bottom: 2rem;
        }

        /* --- 3. Tombol "Buat API Key" (BIRU-HIJAU) --- */
        .generate-btn {
            background-color: #00897B; /* Warna hijau cerah untuk tombol */
            color: #FFFFFF;
            font-weight: bold;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            padding: 1rem;
            width: 100%;
            cursor: pointer;
            margin-bottom: 1.5rem;
            transition: background-color 0.3s ease;
        }
        
        /* Menambahkan style untuk status "loading" */
        .generate-btn:disabled {
            background-color: #004D40;
            cursor: wait;
        }

        .generate-btn:hover {
            background-color: #00A39A;
        }

        /* --- 4. Kotak Teks API Key & Tombol Salin (BIRU-HIJAU) --- */
        .key-container {
            position: relative;
            width: 100%;
        }

        .api-key-input {
            width: 100%;
            background-color: #003632; /* Latar belakang kotak teks yang sangat gelap */
            border: 1px solid #004D40; /* Garis tepi yang samar */
            color: #E0F2F1; /* Warna teks kunci */
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            border-radius: 8px;
            padding: 1rem;
            padding-right: 70px;
            box-sizing: border-box;
        }
        
        /* Menambahkan style untuk pesan error di input */
        .api-key-input.error {
            color: #FFCDD2;
            border-color: #E57373;
        }

        .copy-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background-color: #4CAF50; /* Warna hijau sedang untuk tombol "Salin" */
            color: #FFFFFF;
            border: none;
            border-radius: 6px;
            padding: 0.5rem 0.8rem;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .copy-btn:hover {
            background-color: #66BB6A;
        }

        /* --- 5. Teks Umpan Balik & Info --- */
        .copy-feedback {
            font-size: 0.8rem;
            color: #CFD8DC;
            margin-top: 0.5rem;
            height: 1em;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .copy-feedback.visible {
            visibility: visible;
            opacity: 1;
        }

        .info-text {
            font-size: 0.8rem;
            color: #CFD8DC;
            margin-top: 1.5rem;
            margin-bottom: 0;
        }

        /* --- 6. Footer --- */
        footer {
            margin-top: auto;
            padding: 2rem;
            font-size: 0.9rem;
            color: #BDBDBD;
            text-align: center;
        }
    </style>
</head>
<body>

    <main class="api-card">
        <h1>Create API Key</h1>
        <p class="subtitle">Klik tombol di bawah lalu salin kunci yang tampil di kotak teks.</p>

        <button id="generateBtn" class="generate-btn">Buat API Key</button>

        <div class="key-container">
            <input type="text" id="apiKeyInput" class="api-key-input" value="" readonly>
            <button id="copyBtn" class="copy-btn">Salin</button>
        </div>

        <p id="copyFeedback" class="copy-feedback">sudah di copy di clipboard</p>

        <p class="info-text">Kunci dihasilkan secara aman di sisi server. Simpan di tempat aman.</p>
    </main>

    <footer>
        Copyright DP
    </footer>

    <script>
        // --- 1. Pilih Elemen ---
        const generateBtn = document.getElementById('generateBtn');
        const copyBtn = document.getElementById('copyBtn');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const copyFeedback = document.getElementById('copyFeedback');

        /**
         * PERUBAHAN 2:
         * Fungsi ini sekarang memanggil server Anda menggunakan fetch()
         * dengan metode 'POST' ke endpoint '/create'.
         */
        async function generateApiKey() {
            // Nonaktifkan tombol untuk mencegah klik ganda
            generateBtn.disabled = true;
            generateBtn.textContent = 'Membuat...';
            apiKeyInput.value = 'Menghubungi server...';
            apiKeyInput.classList.remove('error');

            try {
                // Buat permintaan POST ke server Anda
                const response = await fetch('/create', {
                    method: 'POST'
                });

                // Cek jika respons dari server tidak OK (misal: error 500)
                if (!response.ok) {
                    throw new Error(`Server merespons dengan status: ${response.status}`);
                }

                // Ambil data JSON dari respons
                const data = await response.json();

                // Tampilkan API key di kotak input
                if (data.apiKey) {
                    apiKeyInput.value = data.apiKey;
                } else {
                    throw new Error('Respons server tidak mengandung apiKey');
                }

            } catch (error) {
                // Tangani jika ada error jaringan atau error dari server
                console.error('Gagal mengambil API key:', error);
                apiKeyInput.value = 'Gagal mengambil key. Coba lagi.';
                apiKeyInput.classList.add('error');
            } finally {
                // Apapun yang terjadi, aktifkan kembali tombolnya
                generateBtn.disabled = false;
                generateBtn.textContent = 'Buat API Key';
            }
        }

        // --- 3. Fungsi untuk Menyalin ke Clipboard (Tidak berubah) ---
        function copyToClipboard() {
            // Jangan salin jika isinya pesan error
            if (apiKeyInput.classList.contains('error') || apiKeyInput.value === '') {
                return;
            }
            
            apiKeyInput.select();
            apiKeyInput.setSelectionRange(0, 99999);

            navigator.clipboard.writeText(apiKeyInput.value)
                .then(() => {
                    copyFeedback.classList.add('visible');
                    setTimeout(() => {
                        copyFeedback.classList.remove('visible');
                    }, 2000);
                })
                .catch(err => {
                    console.error('Gagal menyalin: ', err);
                });
        }

        // --- 4. Tambahkan Event Listener ke Tombol ---
        generateBtn.addEventListener('click', generateApiKey);
        copyBtn.addEventListener('click', copyToClipboard);

        /**
         * PERUBAHAN 3:
         * Baris 'generateApiKey();' dihapus dari sini
         * agar key tidak otomatis dibuat saat halaman dimuat.
         */
    </script>

</body>
</html>
